<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>ML Model - Customer Churn Prediction</title>
 
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
 
</head>
 
<body>
 
<div class="navbar">
    <a class="brand" href="/">📈 MarketPulse AI</a>
 
    <div class="nav-links">
        <a class="nav-btn active" href="/">General</a>
    </div>
</div>
 
 
<div class="container">
 
<h1 class="page-title">
📊 Customer Churn Prediction
</h1>
 
<p class="page-subtitle">
Endpoint: POST /predict-ml • Use Case: Customer Churn Prediction
</p>
 
 
 
<!-- INPUT CARD -->
 
<div class="card">
 
<div class="section-title">
Input
</div>
 
 
<div class="form-group">
 
<label class="form-label">
Credit Score (300 - 850)
</label>
 
<input
type="number"
class="form-input"
id="creditScore"
placeholder="Enter credit score"
min="300"
max="850">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Geography
</label>
 
<select class="form-input" id="geography">
 
<option value="France">
France
</option>
 
<option value="Germany">
Germany
</option>
 
<option value="Spain">
Spain
</option>
 
</select>
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Gender
</label>
 
<select class="form-input" id="gender">
 
<option value="Male">
Male
</option>
 
<option value="Female">
Female
</option>
 
</select>
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Age (18 - 100)
</label>
 
<input
type="number"
class="form-input"
id="age"
placeholder="Enter age"
min="18"
max="100">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Tenure (0 - 10)
</label>
 
<input
type="number"
class="form-input"
id="tenure"
placeholder="Enter tenure"
min="0"
max="10">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Balance (>= 0)
</label>
 
<input
type="number"
class="form-input"
id="balance"
placeholder="Enter balance"
min="0">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Number Of Products (1 - 4)
</label>
 
<input
type="number"
class="form-input"
id="numProducts"
placeholder="Enter number of products"
min="1"
max="4">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Has Credit Card
</label>
 
<select class="form-input" id="hasCrCard">
 
<option value="1">
Yes (1)
</option>
 
<option value="0">
No (0)
</option>
 
</select>
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Is Active Member
</label>
 
<select class="form-input" id="isActiveMember">
 
<option value="1">
Yes (1)
</option>
 
<option value="0">
No (0)
</option>
 
</select>
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Estimated Salary (>=0)
</label>
 
<input
type="number"
class="form-input"
id="estimatedSalary"
placeholder="Enter salary"
min="0">
 
</div>
 
 
 
 
<div class="form-group">
 
<label class="form-label">
Model
</label>
 
<select class="form-input" id="model">
 
<option>
SVM
</option>
 
<option>
Decision Tree
</option>
 
<option>
Random Forest
</option>
 
</select>
 
</div>
 
 
 
<button
class="submit-btn"
onclick="runModel()">
 
Predict Churn
 
</button>
 
 
</div>
 
 
 
 
 
<!-- OUTPUT CARD -->
 
 
<div class="card">
 
<div class="section-title">
Output
</div>
 
 
<div class="output-card" id="model-output">
 
Prediction result will appear here...
 
</div>
 
 
</div>
 
 
 
</div>
 
 
 
 
 
  <script>
 
const ENDPOINT = "/predict-ml";
 
function createError(id){
    const field = document.getElementById(id);
 
    if(!document.getElementById(id + "-error")){
        const error = document.createElement("div");
        error.id = id + "-error";
        error.className = "field-error";
        field.parentNode.appendChild(error);
    }
}
 
function showError(id, message){
 
    const error = document.getElementById(id + "-error");
    const field = document.getElementById(id);
 
    if(message){
        error.textContent = message;
        field.style.border = "1px solid #dc2626";
    }else{
        error.textContent = "";
        field.style.border = "";
    }
}
 
function validateField(id){
 
    const value = document.getElementById(id).value.trim();
 
    switch(id){
 
        case "creditScore":
            if(value === "") return "Credit Score is required";
            if(+value < 300 || +value > 850)
                return "Credit Score must be between 300 and 850";
            break;
 
        case "age":
            if(value === "") return "Age is required";
            if(+value < 18 || +value > 100)
                return "Age must be between 18 and 100";
            break;
 
        case "tenure":
            if(value === "") return "Tenure is required";
            if(+value < 0 || +value > 10)
                return "Tenure must be between 0 and 10";
            break;
 
        case "balance":
            if(value === "") return "Balance is required";
            if(+value < 0)
                return "Balance cannot be negative";
            break;
 
        case "numProducts":
            if(value === "") return "Number Of Products is required";
            if(+value < 1 || +value > 4)
                return "Number Of Products must be between 1 and 4";
            break;
 
        case "estimatedSalary":
            if(value === "") return "Estimated Salary is required";
            if(+value < 0)
                return "Estimated Salary cannot be negative";
            break;
    }
 
    return "";
}
 
const fields = [
    "creditScore",
    "age",
    "tenure",
    "balance",
    "numProducts",
    "estimatedSalary"
];
 
window.addEventListener("load", () => {
 
    const style = document.createElement("style");
 
    style.innerHTML = `
        .field-error{
            color:#dc2626;
            font-size:12px;
            font-weight:500;
            margin-top:4px;
            min-height:16px;
            display:block;
        }
 
        .form-group{
            margin-bottom:20px;
        }
    `;
 
    document.head.appendChild(style);
 
    fields.forEach(id => {
 
        createError(id);
 
        const field = document.getElementById(id);
 
        field.addEventListener("blur", () => {
 
            const error = validateField(id);
            showError(id, error);
 
        });
 
        field.addEventListener("input", () => {
 
            const error = validateField(id);
            showError(id, error);
 
        });
    });
 
});
 
async function runModel(){
 
    const output = document.getElementById("model-output");
 
    for(const id of fields){
 
        const error = validateField(id);
 
        if(error){
            showError(id,error);
            document.getElementById(id).focus();
            return;
        }
    }
 
    const data = {
 
        CreditScore: Number(document.getElementById("creditScore").value),
 
        Geography: document.getElementById("geography").value,
 
        Gender: document.getElementById("gender").value,
 
        Age: Number(document.getElementById("age").value),
 
        Tenure: Number(document.getElementById("tenure").value),
 
        Balance: Number(document.getElementById("balance").value),
 
        NumOfProducts: Number(document.getElementById("numProducts").value),
 
        HasCrCard: Number(document.getElementById("hasCrCard").value),
 
        IsActiveMember: Number(document.getElementById("isActiveMember").value),
 
        EstimatedSalary: Number(document.getElementById("estimatedSalary").value),
 
        Model: document.getElementById("model").value
    };
 
    output.innerHTML = "⏳ Processing...";
 
    try{
 
        const response = await fetch(
            ENDPOINT,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data)
            }
        );
 
        const result = await response.json();
 
        if(!response.ok){
 
            output.innerHTML = "❌ " + result.detail;
            return;
        }
 
        output.innerHTML = `
            <strong>Selected Model:</strong>
            ${result.model}
 
            <br><br>
 
            <strong>Prediction:</strong>
            ${result.prediction}
        `;
 
    }
    catch(error){
 
        output.innerHTML = `❌ Error: ${error.message}`;
 
    }
}
 
</script>
 
</body>
 
</html>
